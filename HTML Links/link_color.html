<!DOCTYPE html>
<html>

<head>
    <title>Link Color</title>
    <style>
        a:link {
            color: green;
            background-color: transparent;
            text-decoration: none;
        }

        a:visited {
            color: pink;
            text-decoration: none;
        }

        a:active {
            color: red;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h2>Absolute URLs</h2>
    <p><a href="https://www.w3.org">W3S</a></p>
    <br>

    <h2>Local URLs</h2>
    <p><a href="577-200x300.">HTML Images</a></p>

    <h1>Links:</h1><br>
    <a href="https://www.w3schools.com/" target="_blank">Visit W3Schools.com!</a>
</body>

</html>
