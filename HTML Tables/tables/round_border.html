<!DOCTYPE html>
<html>

<head>
    <style>
        th,
        td {
            border: 3px solid dodgerblue;
            border-radius: 10px;
        }

        th,
        td {
            background-color: #96D4D4;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>First Column</th>
            <th>Second Column</th>
            <th>Third Column</th>
        </tr>
        <tr>
            <td>First Col</td>
            <td>Second Col</td>
            <td>Third Col</td>
        </tr>
    </table>
</body>

</html>
