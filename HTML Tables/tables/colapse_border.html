<!DOCTYPE html>
<html>

<head>
    <style>
        table,
        th,
        td {
            border: 1px solid dodgerblue;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>First Column</th>
            <th>Second Column</th>
            <th>Third Column</th>
        </tr>
        <tr>
            <td>First Col</td>
            <td>Second Col</td>
            <td>Third Col</td>
        </tr>
    </table>
</body>

</html>
